<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Bambu Print Sync">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14231c"/>
      <stop offset="1" stop-color="#0d1512"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ae42"/>
      <stop offset="1" stop-color="#7fdc9a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#7fdc9a" stroke-width="1">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200"/>
    <path d="M80 0V320M160 0V320M240 0V320M320 0V320M400 0V320M480 0V320M560 0V320M640 0V320M720 0V320M800 0V320M880 0V320M960 0V320M1040 0V320M1120 0V320"/>
  </g>
  <!-- printed object: stacked layers -->
  <g transform="translate(120 70)">
    <rect x="0" y="150" width="220" height="16" rx="4" fill="url(#layer)"/>
    <rect x="10" y="130" width="200" height="16" rx="4" fill="url(#layer)" opacity="0.92"/>
    <rect x="22" y="110" width="176" height="16" rx="4" fill="url(#layer)" opacity="0.84"/>
    <rect x="36" y="90" width="148" height="16" rx="4" fill="url(#layer)" opacity="0.76"/>
    <rect x="52" y="70" width="70" height="16" rx="4" fill="url(#layer)" opacity="0.68"/>
    <!-- nozzle -->
    <path d="M118 0h44v30l-10 18h-24l-10-18z" fill="#e8efe9"/>
    <rect x="134" y="48" width="12" height="16" fill="#e8efe9"/>
    <path d="M140 64v6" stroke="#00ae42" stroke-width="4" stroke-linecap="round"/>
    <rect x="-20" y="170" width="260" height="8" rx="4" fill="#2c3d34"/>
  </g>
  <text x="430" y="150" fill="#f2f7f3" font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">Bambu Print Sync</text>
  <text x="432" y="200" fill="#a9c4b3" font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26">Plan prints · import history · track spools and cost</text>
  <text x="432" y="244" fill="#5f8a71" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">an Obsidian plugin built on Bases</text>
</svg>
