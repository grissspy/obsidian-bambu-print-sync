name: Release

on:
  push:
    tags:
      - "*"
  # "Run workflow" on main (also from the GitHub mobile app): releases the version in manifest.json.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check and test
        run: |
          npm run build
          npm test
      - name: Work out the version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest $v"; exit 1; }
          elif [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run the release from main, not ${GITHUB_REF_NAME}"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release or add files to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand on GitHub already exists: just attach the files.
          if gh release view "${VERSION}" > /dev/null 2>&1; then
            gh release upload "${VERSION}" main.js manifest.json styles.css --clobber
          else
            # Makes the tag on this commit when it does not exist yet.
            gh release create "${VERSION}" main.js manifest.json styles.css \
              --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
          fi
